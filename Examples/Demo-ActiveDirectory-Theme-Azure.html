      var shown = ids.slice(0, cap || 500);
      return '<div class="tt-list">' + shown.map(chip).join('') + '</div>' +
             (ids.length > shown.length ? '<p class="dh-more">+' + (ids.length - shown.length) + ' more</p>' : '');
    }

    function tabHtml(r) {
      if (tab === 'members') {
        var ms = membersOf[r.id] || [], c = { user: 0, computer: 0, group: 0 };
        ms.forEach(function (m) { if (c[typeOf[m]] !== undefined) c[typeOf[m]]++; });
        return '<p class="dh-text">' + ms.length + ' member' + (ms.length === 1 ? '' : 's') + ': ' + c.user + ' users, ' + c.computer + ' computers, ' + c.group + ' groups.' +
               (ms.length ? ' ' + csvButton('members') : '') + '</p>' + list(ms);
      }
      if (tab === 'memberof') return ((memberOf[r.id] || []).length ? '<p class="dh-text">' + csvButton('memberof') + '</p>' : '') + list(memberOf[r.id] || []);
      if (tab === 'nesting') {
        var h = '';
        if (r.type === 'group') {
          var nest = dhTtNested(membersOf, typeOf, r.id, 6);
          h += '<h4 class="dh-sec-title">Groups nested below</h4>';
          h += nest.length ? '<div class="tt-nest">' + nest.map(function (n) {
            return '<div style="padding-left:' + ((n.depth - 1) * 18) + 'px">' + chip(n.id) + (n.circular ? ' <span class="tt-circ">circular nesting</span>' : '') + '</div>';
          }).join('') + '</div>' : '<p class="dh-text">No groups are nested in this group.</p>';
        }
        var eff = dhTtPaths(memberOf, r.id, maxPaths);
        h += '<h4 class="dh-sec-title">Effective membership: every path up</h4>';
        if (!eff.paths.length) h += '<p class="dh-text">Not a member of any group.</p>';
        else {
          h += '<div class="tt-nest">' + eff.paths.map(function (p) {
            return '<div class="tt-path">' + p.map(function (id, i) { return (i ? '<span class="tt-arrow">→</span>' : '') + chip(id); }).join('') + '</div>';
          }).join('') + '</div>';
          if (eff.more) h += '<p class="dh-more">+' + eff.more + ' more paths</p>';
        }
        if (eff.circular) h += '<p class="tt-circ-note">A group is (directly or indirectly) a member of itself; the loop was not followed.</p>';
        return h;
      }
      var items = [{ label: 'Type', value: DH_TT_TYPE[r.type] || r.type }, { label: 'Location', value: pathLabel(r) }];
      (r.props || []).forEach(function (p) { items.push({ label: p.label, value: p.value }); });
      var secs = [{ kind: 'kv', title: '', columns: 2, items: items }];
      if (r.detail && r.detail.sections) secs = secs.concat(r.detail.sections);

    }

    function renderDetail() {
      var r = selectedId && byId[selectedId];
      if (!r) { head.innerHTML = ''; tabsEl.innerHTML = ''; body.innerHTML = '<p class="dh-text">Select an object on the left.</p>'; return; }
      var st = secStatus(r.status);
      head.innerHTML = '<span class="tt-type tt-type-' + esc(r.type) + '">' + esc(DH_TT_GLYPH[r.type] || '') + '</span>' +
        '<span class="tt-head-label">' + esc(r.label) + '</span>' + (st ? '<span class="dh-pill dh-st-' + st + '">' + esc(SEC_LABEL[st]) + '</span>' : '') +
        (r.flags || []).map(function (f) { return '<span class="dh-tree-flag">' + esc(f) + '</span>'; }).join('');
      var ts = tabsFor(r);
      if (!ts.some(function (x) { return x.k === tab; })) tab = 'props';
      tabsEl.innerHTML = ts.map(function (x) {
        return '<button type="button" class="tt-tab" role="tab" data-tab="' + x.k + '" aria-selected="' + (x.k === tab ? 'true' : 'false') + '" tabindex="' + (x.k === tab ? '0' : '-1') + '">' + esc(x.l) + '</button>';
      }).join('');
      body.innerHTML = tabHtml(r);
    }

    function select(id, keepTab) {
      if (!byId[id]) return;
      selectedId = id; focusId = id;
      if (!keepTab) tab = 'props';
      renderTree(); renderDetail();
    }
    function goTo(id) {                                  /* a link in a tab: make the row visible, then select it */
      var p = byId[id] && byId[id].parent;
      while (p && byId[p]) { expanded[p] = true; p = byId[p].parent; }
      rebuild();
      if (flatIdx[id] === undefined) { findText = ''; find.value = ''; typeSel = {}; container.querySelectorAll('.tt-chip').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); }); }
      select(id);
      if (WIN) { scrollToIdx(flatIdx[id]); paint(false); }
      var el = rowEl(id); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    }

    tree.addEventListener('click', function (e) {
      var rowNode = e.target.closest('.dh-tree-row'); if (!rowNode) return;
      var id = rowNode.getAttribute('data-id'), act = e.target.closest('[data-act]');
      if (act && act.getAttribute('data-act') === 'toggle') { expanded[id] = !expanded[id]; focusId = id; renderTree(id); return; }
      select(id);
    });
    tree.addEventListener('keydown', function (e) {
      var rowNode = e.target.closest && e.target.closest('.dh-tree-row'), id;
      if (rowNode && e.target === rowNode) id = rowNode.getAttribute('data-id');
      else if (e.target === tree && focusId && flatIdx[focusId] !== undefined) id = focusId;   /* windowed: the focused row scrolled away */
      else return;
      var r = byId[id], i = flatIdx[id], key = e.key, to = null;
      if (i === undefined) return;
      var filtering = !!(findText || Object.keys(typeSel).length);
      if (key === 'ArrowDown') to = flat[Math.min(i + 1, flat.length - 1)].r;
      else if (key === 'ArrowUp') to = flat[Math.max(i - 1, 0)].r;
      else if (key === 'Home') to = flat[0].r;
      else if (key === 'End') to = flat[flat.length - 1].r;
      else if (key === 'ArrowRight') {
        if (kids[id].length && !expanded[id] && !filtering) { expanded[id] = true; focusId = id; e.preventDefault(); renderTree(id); return; }
        if (kids[id].length) to = kids[id][0];
      } else if (key === 'ArrowLeft') {
        if (kids[id].length && expanded[id] && !filtering) { expanded[id] = false; focusId = id; e.preventDefault(); renderTree(id); return; }
        to = r.parent ? byId[r.parent] : null;
      } else if (key === 'Enter' || key === ' ') { e.preventDefault(); select(id); var el0 = rowEl(id); if (el0) el0.focus(); return; }
      else return;
      e.preventDefault();
      if (to) { focusId = to.id; renderTree(to.id); }
    });
    /* the row with focus is the keyboard's starting point, however it got focus (Tab, click, script) */
    tree.addEventListener('focusin', function (e) {
      var fr = e.target.closest && e.target.closest('.dh-tree-row');
      if (fr) focusId = fr.getAttribute('data-id');
    });
    var findTimer = 0;
    find.addEventListener('input', function () {
      findText = find.value;
      if (!WIN) { renderTree(); return; }
      clearTimeout(findTimer);
      findTimer = setTimeout(function () { tree.scrollTop = 0; renderTree(); }, 150);   /* 50,000 rows: wait for a pause in typing */
    });
    container.querySelector('.tt-toolbar').addEventListener('click', function (e) {
      var tb = e.target.closest('[data-tt]');
      if (tb && tb.getAttribute('data-tt') === 'csv') {
        dhCsvDownload(csvOf(flat.map(function (x) { return x.r; })), csvName('visible'));
        return;
      }
      if (tb) {
        if (tb.getAttribute('data-tt') === 'expand') order.forEach(function (r) { if (kids[r.id].length) expanded[r.id] = true; });
        else expanded = {};
        renderTree(); return;
      }
      var ch = e.target.closest('[data-tt-type]');
      if (ch) {
        var t = ch.getAttribute('data-tt-type');
        if (typeSel[t]) delete typeSel[t]; else typeSel[t] = true;
        ch.setAttribute('aria-pressed', typeSel[t] ? 'true' : 'false');
        renderTree();
      }
    });
    tabsEl.addEventListener('click', function (e) {
      var b = e.target.closest('[data-tab]'); if (!b) return;
      tab = b.getAttribute('data-tab'); renderDetail();
    });
    tabsEl.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.key !== 'Home' && e.key !== 'End') return;
      var bs = Array.prototype.slice.call(tabsEl.querySelectorAll('[data-tab]')), i = bs.indexOf(document.activeElement);
      if (i < 0) return;
      e.preventDefault();
      var n = e.key === 'Home' ? 0 : e.key === 'End' ? bs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + bs.length) % bs.length;
      tab = bs[n].getAttribute('data-tab'); renderDetail();
      var nb = tabsEl.querySelector('[data-tab="' + tab + '"]'); if (nb) nb.focus();
    });
    body.addEventListener('click', function (e) {
      var cb = e.target.closest('[data-tt-csv]');
      if (cb && selectedId && byId[selectedId]) {
        var kind = cb.getAttribute('data-tt-csv'), sr = byId[selectedId];
        var ids = (kind === 'members' ? membersOf[sr.id] : memberOf[sr.id]) || [];
        dhCsvDownload(csvOf(ids.map(function (x) { return byId[x]; }).filter(Boolean)), csvName(sr.label + '-' + (kind === 'members' ? 'members' : 'member-of')));
        return;
      }
      var g = e.target.closest('[data-goto]'); if (g) goTo(g.getAttribute('data-goto'));
    });

    if (roots.length) select(roots[0].id); else { renderTree(); renderDetail(); }
  }
  /* =========================================================================
     NETWORK MAP (v2.4.0) - Add-DhNetworkMap
     Layout and path finding are PURE functions (data in, numbers out) and
     deterministic: same input, same picture. No force simulation (decision D3).
     Pan/zoom is createPanZoom() shared with the topology map. One delegated
     click handler on the SVG; no per-node listeners.
     ========================================================================= */

  var DH_NET = { GX: 26, GY: 30, PAD: 14, HEAD: 26, TOP: 1100, MARGIN: 20, LANE_LABEL: 96, LANE_PAD: 30 };

  /* Place boxes left to right, wrapping at `limit`. Mutates x/y on each item. */
  function dhNetFlow(items, limit, gap) {
    var x = 0, y = 0, rowH = 0, maxW = 0;
    items.forEach(function (it) {
      if (x > 0 && x + it.w > limit) { x = 0; y += rowH + gap; rowH = 0; }
      it.x = x; it.y = y; x += it.w + gap;
      if (it.h > rowH) rowH = it.h;
      if (x - gap > maxW) maxW = x - gap;
    });
    return { w: maxW, h: items.length ? y + rowH : 0 };
  }

  /* Rect-edge point on the line from the rect centre toward (tx, ty). */
  function dhNetBoundary(r, tx, ty) {
    var cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = tx - cx, dy = ty - cy;
    if (!dx && !dy) return { x: cx, y: cy };
    var s = Math.min(dx ? (r.w / 2) / Math.abs(dx) : Infinity, dy ? (r.h / 2) / Math.abs(dy) : Infinity);
    return { x: cx + dx * s, y: cy + dy * s };
  }

  /* Layout of a network map. Returns
     { pos:{id:{x,y,w,h}}, groups:[{id,label,status,x,y,w,h,depth}], lanes:[{tier,label,y,h}], width, height } */
  function dhNetLayout(block) {
    var G = DH_NET, nodes = block.nodes || [], edges = block.edges || [], groups = block.groups || [];
    var nw = block.nodeWidth || 150, nh = block.nodeHeight || 46;
    var pos = {}, outGroups = [], lanes = [];

    if (String(block.layout || 'grouped') === 'layered') {
      var byId = {}, out = {}, indeg = {}, depth = {}, order = {};
      nodes.forEach(function (n, i) { byId[n.id] = n; out[n.id] = []; indeg[n.id] = 0; order[n.id] = i; });
      edges.forEach(function (e) {
        if (e.from === e.to || !byId[e.from] || !byId[e.to]) return;
        out[e.from].push(e.to); indeg[e.to]++;
      });
      var seen = {};
      function bfs(startId) {
        var q = [startId]; seen[startId] = true; depth[startId] = 0;
        for (var qi = 0; qi < q.length; qi++) {
          out[q[qi]].forEach(function (t) {
            if (!seen[t]) { seen[t] = true; depth[t] = depth[q[qi]] + 1; q.push(t); }
          });
        }
      }
      nodes.forEach(function (n) { if (!indeg[n.id] && !seen[n.id]) bfs(n.id); });
      nodes.forEach(function (n) { if (!seen[n.id]) bfs(n.id); });      /* what is left sits in a cycle */

      var tierOf = {}, tiers = [];
      nodes.forEach(function (n) {
        var t = (n.tier !== undefined && n.tier !== null) ? n.tier : depth[n.id];
        tierOf[n.id] = t;
        if (tiers.indexOf(t) === -1) tiers.push(t);
      });
      tiers.sort(function (a, b) { return a - b; });
      var lane = tiers.map(function (t) { return nodes.filter(function (n) { return tierOf[n.id] === t; }).map(function (n) { return n.id; }); });

      /* one barycentre sweep, top to bottom; stable, ties by declaration order */
      var rank = {};
      lane[0].forEach(function (id, i) { rank[id] = (i + 0.5) / lane[0].length; });
      var nbr = {};
      nodes.forEach(function (n) { nbr[n.id] = []; });
      edges.forEach(function (e) {
        if (e.from === e.to || !byId[e.from] || !byId[e.to]) return;
        nbr[e.from].push(e.to); nbr[e.to].push(e.from);
      });
      for (var li = 1; li < lane.length; li++) {
        var keyed = lane[li].map(function (id, i) {
          var sum = 0, cnt = 0;
          nbr[id].forEach(function (o) {
            if (tiers.indexOf(tierOf[o]) < li && rank[o] !== undefined) { sum += rank[o]; cnt++; }
          });
          return { id: id, key: cnt ? sum / cnt : (i + 0.5) / lane[li].length, o: order[id] };
        });
        keyed.sort(function (a, b) { return (a.key - b.key) || (a.o - b.o); });
        lane[li] = keyed.map(function (k) { return k.id; });
        lane[li].forEach(function (id, i) { rank[id] = (i + 0.5) / lane[li].length; });
      }
      var maxW = 0;
      lane.forEach(function (ids) { var w = ids.length * nw + (ids.length - 1) * G.GX; if (w > maxW) maxW = w; });
      var laneH = nh + 2 * G.LANE_PAD, y0 = G.MARGIN;
      lane.forEach(function (ids, i) {
        var w = ids.length * nw + (ids.length - 1) * G.GX, x0 = G.MARGIN + G.LANE_LABEL + (maxW - w) / 2;
        ids.forEach(function (id, k) { pos[id] = { x: x0 + k * (nw + G.GX), y: y0 + G.LANE_PAD, w: nw, h: nh }; });
        lanes.push({ tier: tiers[i], label: 'Tier ' + tiers[i], y: y0, h: laneH });
        y0 += laneH;
      });
      return { pos: pos, groups: [], lanes: lanes, width: G.MARGIN * 2 + G.LANE_LABEL + maxW, height: y0 + G.MARGIN };
    }

    /* grouped */
    var gById = {}, kidsOf = {}, nodesOf = { '': [] };
    groups.forEach(function (g) { gById[g.id] = g; kidsOf[g.id] = []; nodesOf[g.id] = []; });
    var rootGroups = [];
    groups.forEach(function (g) { if (g.parent && gById[g.parent]) kidsOf[g.parent].push(g); else rootGroups.push(g); });
    nodes.forEach(function (n) { (nodesOf[(n.group && gById[n.group]) ? n.group : ''] || nodesOf['']).push(n); });

    function nodesBlock(members, inner) {
      var fit = Math.max(1, Math.floor((inner + G.GX) / (nw + G.GX)));
      var cols = Math.max(1, Math.min(Math.ceil(Math.sqrt(members.length)), fit, 5));
      var rows = Math.ceil(members.length / cols);
      return { kind: 'nodes', members: members, cols: cols, w: cols * nw + (cols - 1) * G.GX, h: rows * nh + (rows - 1) * G.GY };
    }
    function groupBox(g, limit) {
      var inner = limit - 2 * G.PAD, items = [];
      if (nodesOf[g.id].length) items.push(nodesBlock(nodesOf[g.id], inner));
      kidsOf[g.id].forEach(function (c) { var b = groupBox(c, inner); b.kind = 'group'; items.push(b); });
      var f = dhNetFlow(items, inner, G.GX);
      var labelW = String(g.label || '').length * 7 + 2 * G.PAD;
      return { g: g, items: items, w: Math.max(f.w + 2 * G.PAD, labelW), h: G.HEAD + f.h + G.PAD };
    }
    function place(box, ox, oy, d) {
      outGroups.push({ id: box.g.id, label: box.g.label, status: box.g.status || '', x: ox, y: oy, w: box.w, h: box.h, depth: d });
      box.items.forEach(function (it) {
        var bx = ox + G.PAD + it.x, by = oy + G.HEAD + it.y;
        if (it.kind === 'nodes') {
          it.members.forEach(function (n, i) {
            pos[n.id] = { x: bx + (i % it.cols) * (nw + G.GX), y: by + Math.floor(i / it.cols) * (nh + G.GY), w: nw, h: nh };
          });
        } else place(it, bx, by, d + 1);
      });
    }
    var top = [];
    if (nodesOf[''].length) top.push(nodesBlock(nodesOf[''], G.TOP));
    rootGroups.forEach(function (g) { var b = groupBox(g, G.TOP); b.kind = 'group'; top.push(b); });
    var tf = dhNetFlow(top, G.TOP, G.GX);
    top.forEach(function (it) {
      var bx = G.MARGIN + it.x, by = G.MARGIN + it.y;
      if (it.kind === 'nodes') {
        it.members.forEach(function (n, i) {
          pos[n.id] = { x: bx + (i % it.cols) * (nw + G.GX), y: by + Math.floor(i / it.cols) * (nh + G.GY), w: nw, h: nh };
        });
      } else place(it, bx, by, 0);
    });
    return { pos: pos, groups: outGroups, lanes: [], width: tf.w + 2 * G.MARGIN, height: tf.h + 2 * G.MARGIN };
  }

  /* Geometry of every edge: parallel edges between a pair fan out; a self edge is a loop.
     Returns [{ d, mx, my, loop }] in the order of `edges`. */
  function dhNetEdgeGeom(edges, pos) {
    var pairs = {}, idx = [];
    edges.forEach(function (e, i) {
      var k = e.from < e.to ? e.from + '\u0001' + e.to : e.to + '\u0001' + e.from;
      (pairs[k] = pairs[k] || []).push(i);
      idx[i] = k;
    });
    return edges.map(function (e, i) {
      var a = pos[e.from], b = pos[e.to];
      if (!a || !b) return null;
      if (e.from === e.to) {
        var tx = a.x + a.w / 2, ty = a.y;
        return { d: 'M' + (tx - 14) + ',' + ty + ' C' + (tx - 34) + ',' + (ty - 40) + ' ' + (tx + 34) + ',' + (ty - 40) + ' ' + (tx + 14) + ',' + ty,
                 mx: tx, my: ty - 30, loop: true };
      }
      var group = pairs[idx[i]], k = group.indexOf(i), n = group.length;
      var lo = e.from < e.to ? a : b, hi = e.from < e.to ? b : a;
      var cax = lo.x + lo.w / 2, cay = lo.y + lo.h / 2, cbx = hi.x + hi.w / 2, cby = hi.y + hi.h / 2;
      var dx = cbx - cax, dy = cby - cay, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var off = (k - (n - 1) / 2) * 30;
      var cx = (cax + cbx) / 2 + (-dy / len) * off * 2, cy = (cay + cby) / 2 + (dx / len) * off * 2;
      var p0 = dhNetBoundary(a, cx, cy), p2 = dhNetBoundary(b, cx, cy);
      return { d: 'M' + p0.x.toFixed(1) + ',' + p0.y.toFixed(1) + ' Q' + cx.toFixed(1) + ',' + cy.toFixed(1) + ' ' + p2.x.toFixed(1) + ',' + p2.y.toFixed(1),
               mx: 0.25 * p0.x + 0.5 * cx + 0.25 * p2.x, my: 0.25 * p0.y + 0.5 * cy + 0.25 * p2.y, loop: false };
    });
  }

  /* Shortest path from startId to the nearest Target node. Directed edges are followed
     forward only; 'both' and 'none' edges either way. BFS in declaration order, so ties
     are broken deterministically. Returns { nodes:[ids], edges:[edge indexes] } or null. */
  function dhNetPath(block, startId) {
    var nodes = block.nodes || [], edges = block.edges || [], byId = {}, adj = {};
    nodes.forEach(function (n) { byId[n.id] = n; adj[n.id] = []; });
    if (!byId[startId]) return null;
    edges.forEach(function (e, i) {
      if (!byId[e.from] || !byId[e.to] || e.from === e.to) return;
      adj[e.from].push({ to: e.to, i: i });
      if (e.direction === 'both' || e.direction === 'none') adj[e.to].push({ to: e.from, i: i });
    });
    if (byId[startId].target) return { nodes: [startId], edges: [] };
    var prev = {}, q = [startId], seen = {};
    seen[startId] = true;
    for (var qi = 0; qi < q.length; qi++) {
      var cur = q[qi];
      for (var k = 0; k < adj[cur].length; k++) {
        var s = adj[cur][k];
        if (seen[s.to]) continue;
        seen[s.to] = true; prev[s.to] = { from: cur, i: s.i }; q.push(s.to);
        if (byId[s.to].target) {
          var pn = [s.to], pe = [], at = s.to;
          while (at !== startId) { pe.unshift(prev[at].i); at = prev[at].from; pn.unshift(at); }
          return { nodes: pn, edges: pe };
        }
      }
    }
    return null;
  }

  function dhNetTrunc(s, max) {
    s = String(s == null ? '' : s);
    return s.length > max ? s.slice(0, Math.max(1, max - 1)) + '…' : s;
  }

  var DH_NET_STATUSES = ['ok', 'warn', 'danger', 'info', 'nodata'];

  function renderNetworkMap(container, block) {
    container.className = 'network-map-section';
    var nodes = block.nodes || [], edges = block.edges || [];
    var titleHtml = block.title ? '<h3 class="network-map-title">' + esc(block.title) + '</h3>' : '';
    if (!nodes.length) { container.innerHTML = titleHtml + '<div class="network-map-empty">No nodes.</div>'; return; }

    var nw = block.nodeWidth || 150, nh = block.nodeHeight || 46;
    var L = dhNetLayout(block), geom = dhNetEdgeGeom(edges, L.pos);
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    var uid = 'nm-' + block.id.replace(/[^A-Za-z0-9_-]/g, '_');

    /* ---- svg body ---------------------------------------------------- */
    var markerDefs = DH_NET_STATUSES.concat(['none']).map(function (s) {
      return '<marker id="' + uid + '-arr-' + s + '" class="nm-arrow nm-e-' + s + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>';
    }).join('');

    var lanesSvg = L.lanes.map(function (ln, i) {
      return '<g class="nm-lane"><rect class="nm-lane-band' + (i % 2 ? ' nm-lane-alt' : '') + '" x="' + DH_NET.MARGIN + '" y="' + ln.y + '" width="' + (L.width - 2 * DH_NET.MARGIN) + '" height="' + ln.h + '"/>' +

    var groupsSvg = L.groups.map(function (g) {

             '<text class="nm-group-label" x="' + (g.x + 10) + '" y="' + (g.y + 17) + '">' + esc(dhNetTrunc(g.label, Math.floor(g.w / 7))) + '</text></g>';

    var edgesSvg = edges.map(function (e, i) {
      var gm = geom[i]; if (!gm) return '';

      var mk = (dir === 'forward' || dir === 'both' ? ' marker-end="url(#' + uid + '-arr-' + st + ')"' : '') +

      var tipText = e.tooltip || ((byId[e.from] ? byId[e.from].label : e.from) + ' → ' + (byId[e.to] ? byId[e.to].label : e.to) + (e.label ? ': ' + e.label : ''));

              '<text x="' + gm.mx.toFixed(1) + '" y="' + (gm.my + 3.5).toFixed(1) + '" text-anchor="middle">' + esc(e.label) + '</text></g>';

      var aria = n.label + (n.status ? ', ' + (SEC_LABEL[n.status] || n.status) : '') + (badges.length ? ', ' + badges.join(', ') : '') + (n.target ? ', target' : '');
      var tip = n.tooltip || (n.label + (badges.length ? ' (' + badges.join(', ') + ')' : ''));
      return '<g class="nm-node' + st + (n.target ? ' nm-target' : '') + '" data-id="' + esc(n.id) + '" tabindex="0" role="button" aria-label="' + esc(aria) + '"' +
             ' data-tip="' + esc(tip) + '" transform="translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')">' +
             '<rect class="nm-node-box" width="' + p.w + '" height="' + p.h + '" rx="7"/>' +
             '<circle class="nm-led" cx="13" cy="' + (p.h / 2) + '" r="4.5"/>' +
             '<text class="nm-node-label" x="26" y="' + yLabel.toFixed(1) + '">' + esc(dhNetTrunc(label, maxChars)) + '</text>' +
             (bTxt ? '<text class="nm-node-badges" x="26" y="' + yBadge.toFixed(1) + '">' + esc(dhNetTrunc(bTxt, maxChars + 2)) + '</text>' : '') +
             (n.target ? '<text class="nm-target-mark" x="' + (p.w - 14) + '" y="15" text-anchor="middle">◎</text>' : '') +

    }).join('');

    /* ---- toolbar ------------------------------------------------------ */
    var stSet = [], bdSet = [];
    nodes.forEach(function (n) {
      if (n.status && stSet.indexOf(n.status) === -1) stSet.push(n.status);
      (n.badges || []).forEach(function (b) { if (bdSet.indexOf(b) === -1) bdSet.push(b); });
    });
    stSet.sort(function (a, b) { return DH_NET_STATUSES.indexOf(a) - DH_NET_STATUSES.indexOf(b); });
    var hasTarget = nodes.some(function (n) { return n.target; });
    var chips =
      stSet.map(function (s) { return '<button type="button" class="nm-chip nm-st-' + s + '" data-f="s:' + esc(s) + '" aria-pressed="false"><span class="nm-chip-dot"></span>' + esc(SEC_LABEL[s] || s) + '</button>'; }).join('') +
      bdSet.slice(0, 12).map(function (b) { return '<button type="button" class="nm-chip" data-f="b:' + esc(b) + '" aria-pressed="false">' + esc(b) + '</button>'; }).join('');
    var legendHtml = '';
    if (block.legend) {
      legendHtml = '<div class="nm-legend" aria-label="Legend">' +
        DH_NET_STATUSES.map(function (s) { return '<span class="nm-legend-item nm-st-' + s + '"><span class="nm-chip-dot"></span>' + esc(SEC_LABEL[s]) + '</span>'; }).join('') +
        '<span class="nm-legend-item"><svg width="30" height="8" aria-hidden="true"><line x1="0" y1="4" x2="30" y2="4" class="nm-legend-line"/></svg>link</span>' +
        '<span class="nm-legend-item"><svg width="30" height="8" aria-hidden="true"><line x1="0" y1="4" x2="30" y2="4" class="nm-legend-line nm-dashed-line"/></svg>dashed</span>' +

    var srList = '<ul class="nm-sr">' + edges.map(function (e) {

    }).join('') + '</ul>';

    var initH = Math.min(Math.max(block.height || 520, 200), 1600);
    container.innerHTML = titleHtml +
      '<div class="network-map-toolbar" role="toolbar" aria-label="Network map controls">' +
        '<button type="button" class="topo-btn" data-topo-act="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>' +
        '<button type="button" class="topo-btn" data-topo-act="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>' +
        '<button type="button" class="topo-btn" data-topo-act="reset" title="Reset view" aria-label="Reset view">⤢</button>' +
        '<input type="search" class="nm-search" placeholder="Find node…" aria-label="Find a node" autocomplete="off">' +
        '<button type="button" class="nm-btn" data-nm="labels" aria-pressed="true" title="Show or hide link labels">Labels</button>' +
        (hasTarget ? '<button type="button" class="nm-btn" data-nm="path" aria-pressed="false" title="Select a node, then trace the shortest path to the nearest target">Trace path</button>' : '') +
        '<button type="button" class="nm-btn" data-nm="svg" title="Download as SVG">SVG</button>' +
        (chips ? '<span class="nm-chips" role="group" aria-label="Filters">' + chips + '</span>' : '') +
      '</div>' + legendHtml +
      '<div class="network-map-inner topo-interactive" style="height:' + initH + 'px">' +
        '<svg class="network-map-svg" width="100%" height="100%" role="group" aria-label="' + esc((block.title || 'Network map') + ': ' + nodes.length + ' nodes, ' + edges.length + ' links') + '">' +
          '<defs>' + markerDefs + '</defs><g class="topo-viewport nm-viewport">' +
          '<g class="nm-lanes">' + lanesSvg + '</g><g class="nm-groups">' + groupsSvg + '</g><g class="nm-edges">' + edgesSvg + '</g><g class="nm-nodes">' + nodesSvg + '</g>' +
        '</g></svg></div>' +
      '<div class="nm-status" role="status" aria-live="polite"></div>' + srList;

    var innerDiv = container.querySelector('.network-map-inner');
    var svgEl = container.querySelector('.network-map-svg');
    var vp = container.querySelector('.nm-viewport');
    var tbar = container.querySelector('.network-map-toolbar');
    var statusEl = container.querySelector('.nm-status');
    var search = container.querySelector('.nm-search');
    var nodeEls = {}, edgeEls = [];
    container.querySelectorAll('.nm-node').forEach(function (el) { nodeEls[el.getAttribute('data-id')] = el; });
    container.querySelectorAll('.nm-edge').forEach(function (el) { edgeEls[parseInt(el.getAttribute('data-ei'), 10)] = el; });
    if (edges.length > 400) container.classList.add('nm-hide-labels');

    var pz = createPanZoom({
      innerDiv: innerDiv, svgEl: svgEl, vp: vp, initH: initH, toolbar: tbar,
      getContent: function () { return { w: L.width, h: L.height }; }
    });
    pz.syncViewBox(); pz.fit();

    /* ---- state + painting -------------------------------------------- */
    var fStatus = {}, fBadge = {}, selected = null, pathMode = false, pathRes = null, q = '';
    function nodeMatches(n) {
      var sK = Object.keys(fStatus), bK = Object.keys(fBadge);
      if (sK.length && !fStatus[n.status || '']) return false;
      if (bK.length && !(n.badges || []).some(function (b) { return fBadge[b]; })) return false;
      if (q) {
        var hay = (n.label + ' ' + n.id + ' ' + (n.badges || []).join(' ')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }
    function paint() {
      var anyFilter = Object.keys(fStatus).length || Object.keys(fBadge).length || q;
      var near = null;
      if (selected && !pathRes) {
        near = {}; near[selected] = true;
        edges.forEach(function (e) {
          if (e.from === selected) near[e.to] = true;
          if (e.to === selected) near[e.from] = true;
        });
      }
      var onPathN = {}, onPathE = {};
      if (pathRes) { pathRes.nodes.forEach(function (id) { onPathN[id] = true; }); pathRes.edges.forEach(function (i) { onPathE[i] = true; }); }
      nodes.forEach(function (n) {
        var el = nodeEls[n.id]; if (!el) return;
        var dim = (anyFilter && !nodeMatches(n)) || (near && !near[n.id]) || (pathRes && !onPathN[n.id]);
        el.classList.toggle('nm-dim', !!dim);
        el.classList.toggle('nm-sel', selected === n.id);
        el.classList.toggle('nm-onpath', !!onPathN[n.id] && !!pathRes);
      });
      edges.forEach(function (e, i) {
        var el = edgeEls[i]; if (!el) return;
        var a = byId[e.from], b = byId[e.to];
        var dim = (anyFilter && ((a && !nodeMatches(a)) || (b && !nodeMatches(b)))) ||
                  (selected && !pathRes && e.from !== selected && e.to !== selected) || (pathRes && !onPathE[i]);
        el.classList.toggle('nm-dim', !!dim);
        el.classList.toggle('nm-onpath', !!onPathE[i] && !!pathRes);
      });
    }
    function say(t) { statusEl.textContent = t || ''; }
    function updatePath() {
      pathRes = null;
      if (pathMode && selected) {
        pathRes = dhNetPath(block, selected);
        var s = byId[selected];
        if (!pathRes) say('No path from ' + s.label + ' to a target node.');
        else if (pathRes.nodes.length === 1) say(s.label + ' is itself a target.');
        else say('Path to ' + byId[pathRes.nodes[pathRes.nodes.length - 1]].label + ' (' + (pathRes.nodes.length - 1) + ' hop' + (pathRes.nodes.length === 2 ? '' : 's') + '): ' +
                 pathRes.nodes.map(function (id) { return byId[id].label; }).join(' → '));
      } else if (selected) {
        say(byId[selected].label + ' selected. Click the background to clear.');
      } else say('');
    }
    function select(id, el) {
      selected = (selected === id && !pathMode) ? null : id;
      updatePath(); paint();
      var n = byId[id];
      if (selected !== id) return;
      if (n.detail) {
        dhDrawerOpen({ title: n.detail.title || n.label, subtitle: n.detail.subtitle || '', sections: n.detail.sections,
                       tableId: n.linkTableId || '', filter: n.linkFilter || '' }, { opener: el });
      } else if (n.linkTableId) jumpToTable(n.linkTableId, n.linkFilter);
    }
    function centreOn(id) {
      var p = L.pos[id]; if (!p) return;
      var r = innerDiv.getBoundingClientRect(), sc = pz.view.scale;
      pz.view.tx = (r.width || 600) / 2 - (p.x + p.w / 2) * sc;
      pz.view.ty = (r.height || initH) / 2 - (p.y + p.h / 2) * sc;
      pz.zoomAround((r.width || 600) / 2, (r.height || initH) / 2, 1);
    }

    /* ---- events ------------------------------------------------------- */
    svgEl.addEventListener('click', function (e) {
      if (pz.dragged()) return;
      var nodeEl = e.target.closest('.nm-node');
      if (nodeEl) { select(nodeEl.getAttribute('data-id'), nodeEl); return; }
      var edgeEl = e.target.closest('.nm-edge');
      if (edgeEl) {
        var ed = edges[parseInt(edgeEl.getAttribute('data-ei'), 10)];
        if (ed && ed.linkTableId) jumpToTable(ed.linkTableId, ed.linkFilter);
        return;
      }
      if (selected) { selected = null; updatePath(); paint(); }
    });
    svgEl.addEventListener('keydown', function (e) {
      var nodeEl = e.target.closest && e.target.closest('.nm-node');
      if (nodeEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(nodeEl.getAttribute('data-id'), nodeEl); }
      else if (e.key === 'Escape' && selected) { selected = null; updatePath(); paint(); }
    });
    svgEl.addEventListener('mousemove', function (e) {
      var t = e.target.closest && e.target.closest('[data-tip]');
      if (t && !pz.dragged()) _topoShowTooltip(t.getAttribute('data-tip'), e); else _topoHideTooltip();
    });
    svgEl.addEventListener('mouseleave', _topoHideTooltip);

    tbar.addEventListener('click', function (e) {
      var chip = e.target.closest('.nm-chip');
      if (chip) {
        var f = chip.getAttribute('data-f'), set = f.charAt(0) === 's' ? fStatus : fBadge, key = f.slice(2);
        if (set[key]) delete set[key]; else set[key] = true;

      var btn = e.target.closest('[data-nm]'); if (!btn) return;
      var a = btn.getAttribute('data-nm');

        btn.setAttribute('aria-pressed', on ? 'false' : 'true');
      } else if (a === 'path') {
        pathMode = !pathMode;
        btn.setAttribute('aria-pressed', pathMode ? 'true' : 'false');
        if (pathMode && !selected) say('Select a node to trace its path to a target.'); else { updatePath(); paint(); }
      } else if (a === 'svg') dhNetDownload(svgEl, L, block);
    });
    var labelsBtn = tbar.querySelector('[data-nm="labels"]');
    if (labelsBtn && edges.length > 400) labelsBtn.setAttribute('aria-pressed', 'false');
    search.addEventListener('input', function () { q = search.value.trim().toLowerCase(); paint(); });
    search.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var hit = nodes.filter(nodeMatches)[0];
      if (hit) centreOn(hit.id);
    });
    paint();
  }

  /* Download the map as a stand-alone SVG: the .nm-* rules and the theme variables
     they use are copied in, because a saved file has no page stylesheet. */
  function dhNetDownload(svgEl, L, block) {
    try {
      var clone = svgEl.cloneNode(true);
      var vpc = clone.querySelector('.nm-viewport');
      if (vpc) vpc.removeAttribute('transform');
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('viewBox', '0 0 ' + L.width + ' ' + L.height);
      clone.setAttribute('width', L.width); clone.setAttribute('height', L.height);
      var css = '', vars = {};
      Array.prototype.forEach.call(document.styleSheets, function (ss) {
        var rules; try { rules = ss.cssRules; } catch (e) { return; }
        Array.prototype.forEach.call(rules || [], function (r) {
          if (r.type === 1 && /\.nm-|\.topo-/.test(r.selectorText) && !/network-map|\.nm-(chip|btn|search|status|sr|legend)/.test(r.selectorText)) css += r.cssText + '\n';
        });
      });
      var cs = getComputedStyle(svgEl), m, rx = /var\((--[\w-]+)/g;
      while ((m = rx.exec(css))) vars[m[1]] = cs.getPropertyValue(m[1]).trim();
      var decl = Object.keys(vars).map(function (k) { return k + ':' + vars[k]; }).join(';');
      var st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      st.textContent = 'svg{' + decl + ';font-family:' + (cs.fontFamily || 'sans-serif') + '}\n' + css;
      clone.insertBefore(st, clone.firstChild);
      var bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('width', '100%'); bg.setAttribute('height', '100%');
      bg.setAttribute('fill', getComputedStyle(document.body).backgroundColor || '#fff');
      clone.insertBefore(bg, st.nextSibling);
      var blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = (block.id || 'network-map') + '.svg';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    } catch (e) { /* download is a convenience; never break the page */ }
  }
  /* =========================================================================
     REPORT SEARCH (v2.4.0) - New-DhDashboard -Search
     One box in the menu bar. It finds menu pages, block and table titles,
     findings, and table rows (a hit count per table). Table rows are scanned in
     time slices so a large table never freezes typing, with the same matcher the
     table's own filter uses (TableEngine._matchText). A result opens its page;
     a table hit goes through jumpToTable, so the filter, URL state and clear
     button behave exactly as for a click on a chart. All text goes through esc();
     the query is never written into innerHTML or the URL.
     ========================================================================= */

  /* Every searchable thing that is not a table row; built once, the page is static. */
  function dhSearchIndex() {
    var tree = buildNavTree(), out = { pages: [], findings: [] };
    (function walk(node) {
      node.order.forEach(function (seg) {
        var c = node.children[seg];
        out.pages.push({ kind: 'page', text: c.label, sub: c.path.join(' › '), path: c.path });
        walk(c);
      });
    })(tree);
    function pathOfEl(id) {
      var el = document.getElementById(id), sec = el && el.closest('[data-navpath]');
      return sec ? navPathOf(sec) : [];
    }
    (typeof BLOCKS_CONFIG !== 'undefined' ? BLOCKS_CONFIG : []).forEach(function (b) {
      var p = pathOfEl('block-' + b.id);
      if (b.title) out.pages.push({ kind: 'block', text: b.title, sub: p.join(' › '), path: p, elId: 'block-' + b.id });
      if (b.blockType === 'findings') {
        (b.findings || []).forEach(function (f) {
          out.findings.push({ kind: 'finding', text: f.title, sub: [f.area, p.join(' › ')].filter(Boolean).join(' · '),
            path: p, blockId: b.id, findingId: f.id,
            hay: [f.id, f.title, f.area, f.description, f.recommendation].join(' ').toLowerCase() });
        });
      }
    });
    TABLES_CONFIG.forEach(function (t) {
      out.pages.push({ kind: 'block', text: t.title || t.id, sub: pathOfEl('section-' + t.id).join(' › '), path: pathOfEl('section-' + t.id), elId: 'section-' + t.id });
    });
    return out;
  }

  function initSearch() {
    var input = document.getElementById('nav-search-input'), list = document.getElementById('nav-search-list');
    if (!input || !list) return;
    var index = null, timer = null, token = 0, flat = [], active = -1, current = '';

    function closeList() {
      list.hidden = true; list.innerHTML = '';
      input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant');
      flat = []; active = -1;
    }

    function render(groups, busy) {
      flat = []; var h = '';
      groups.forEach(function (g) {
        if (!g.items.length) return;
        h += '<div class="ns-group" role="presentation">' + esc(g.title) + '</div>';
        g.items.forEach(function (r) {
          var i = flat.push(r) - 1;
          h += '<button type="button" class="ns-item" role="option" id="ns-opt-' + i + '" data-i="' + i + '" aria-selected="false">' +
               (r.count !== undefined ? '<span class="ns-count">' + esc(r.count.toLocaleString()) + (r.partial ? '+' : '') + '</span>' : '') +
               esc(r.text) + (r.sub ? '<span class="ns-sub">' + esc(r.sub) + '</span>' : '') + '</button>';
        });
      });
      if (!flat.length) h = '<div class="ns-empty" role="presentation">' + (busy ? 'Searching…' : 'No results.') + '</div>';
      list.innerHTML = h; list.hidden = false;
      input.setAttribute('aria-expanded', 'true');
      active = -1;
    }

    function rank(text, term) {
      var t = String(text || '').toLowerCase(), i = t.indexOf(term);
      return i === -1 ? -1 : (i === 0 ? 0 : 1);
    }
    function pick(items, term, hayOf) {
      return items.map(function (r) { return { r: r, k: rank(hayOf ? hayOf(r) : r.text, term) }; })
        .filter(function (x) { return x.k >= 0; })
        .sort(function (a, b) { return a.k - b.k; })
        .slice(0, 8).map(function (x) { return x.r; });
    }

    function run(q) {
      var my = ++token, term = q.toLowerCase();
      if (!index) index = dhSearchIndex();
      var seenBlock = {};
      var pages = pick(index.pages, term).filter(function (r) {            /* a menu page and a block of the same name: show one */
        var k = r.kind + '|' + r.text + '|' + r.sub;
        if (seenBlock[k]) return false; seenBlock[k] = true; return true;
      });
      var findings = pick(index.findings, term, function (r) { return r.hay; });
      var tables = [];
      var groups = [{ title: 'Pages', items: pages }, { title: 'Findings', items: findings }, { title: 'Tables', items: tables }];
      render(groups, true);

      /* table rows: engine by engine, time-sliced, cancelled by newer input */
      var ids = Object.keys(engines), ei = 0, deadline = Date.now() + 1500, partial = false;
      function nextEngine() {
        if (my !== token) return;
        if (ei >= ids.length) { render(groups, false); return; }
        var id = ids[ei++], eng = engines[id], rows = eng.allData, cols = eng._visibleCols(), n = 0, ri = 0;
        function slice() {
          if (my !== token) return;
          var stop = Date.now() + 30;
          while (ri < rows.length && Date.now() < stop) {
            var lim = Math.min(rows.length, ri + 500);
            for (; ri < lim; ri++) if (eng._matchText(rows[ri], term, cols)) n++;
          }
          if (ri < rows.length) {
            if (Date.now() > deadline) { partial = true; finish(true); return; }
            setTimeout(slice, 0); return;
          }
          finish(false);
        }
        function finish(cut) {
          if (n > 0 && tables.length < 12) {
            var sec = document.getElementById('section-' + id);
            tables.push({ kind: 'table', text: eng.title || id, sub: (sec ? navPathOf(sec).join(' › ') : ''), id: id, count: n, partial: cut });
            tables.sort(function (a, b) { return b.count - a.count; });

          }
          if (cut) { render(groups, false); return; }

    }

    function focusFinding(r) {
      var host = document.getElementById('block-' + r.blockId); if (!host) return;
      var els = host.querySelectorAll('[data-finding-id]'), el = null;
      for (var i = 0; i < els.length; i++) if (els[i].getAttribute('data-finding-id') === String(r.findingId)) { el = els[i]; break; }

    }

    function go(r) {

      else if (r.kind === 'table') jumpToTable(r.id, current);

        if (r.kind === 'finding') focusFinding(r);
        else { var el = document.getElementById(r.elId); if (el && el.scrollIntoView) { el.scrollIntoView({ block: 'start' }); el.classList.remove('dh-flash'); void el.offsetWidth; el.classList.add('dh-flash'); } }

    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active < 0 ? -1 : active - 1); }
      else if (e.key === 'Enter') { if (flat.length) { e.preventDefault(); go(flat[active >= 0 ? active : 0]); } }
      else if (e.key === 'Escape') { token++; if (!list.hidden) closeList(); else { input.value = ''; current = ''; input.blur(); } }
    });
    list.addEventListener('click', function (e) {
      var b = e.target.closest('.ns-item'); if (!b) return;

    document.addEventListener('click', function (e) {

    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target, tag = t && t.tagName;

  }
  /* =========================================================================
     PRINT (v2.2.0)

     The interactive page shows one nav view at a time, folds things away and
     pages its tables. A printout needs the opposite, so between beforeprint
     and afterprint the page is temporarily rearranged:

       - light theme (dark backgrounds waste toner and print badly);
       - every nav view, in menu order, each under a heading with its path;
       - every table shows its filtered rows up to PRINT_CONFIG.maxRows, with
         "Showing N of M rows" when some were left out;
       - an optional cover page (New-DhDashboard -PrintCover).

     Expanding folded content (collapsibles, findings, tab panels, table
     sections) is done in CSS (@media print), so it also works for a printer
     that never runs these handlers. Everything here is undone on afterprint.

     Headless browsers printing to PDF (Edge/Chrome --print-to-pdf, used by
     report pipelines) fire beforeprint too, so they get the same layout.
     ========================================================================= */
  var _printState = null;

  function _navLabelPath(tree, path) {
    var labels = [], node = tree;
    for (var i = 0; i < path.length; i++) {
      node = node && node.children ? node.children[path[i]] : null;
      labels.push(node && node.label ? node.label : path[i]);
    }
    return labels;
  }

  /* Menu order: depth-first over the nav tree, children in the order the
     menu shows them. Returns pathKey -> rank. */
  function _navOrderIndex(tree) {
    var rank = {}, n = 0;
    (function walk(node) {
      rank[JSON.stringify(node.path || [])] = n++;
      (node.order || Object.keys(node.children || {})).forEach(function (k) {
        if (node.children[k]) walk(node.children[k]);
      });
    })(tree);
    return rank;
  }

  function _cssString(s) {
    return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/[\r\n]+/g, ' ') + '"';
  }

  function dhBeforePrint() {
    if (_printState) return;                         /* already arranged */
    if (typeof dhDrawerClose === 'function') dhDrawerClose(true);   /* v2.3.0: no drawer on paper */
    var st = _printState = { theme: themeMode, moved: [], added: [], engines: {}, reopened: [] };
    /* v2.5.2: the group of removed rows (baseline markers) prints open */
    document.querySelectorAll('details.tbl-removed').forEach(function (d) {
      if (!d.open) { d.open = true; st.reopened.push(d); }
      /* 2.5.3: rows are drawn on open, and the toggle event fires too late for print: draw them now */
      var eng = engines[d.id.replace(/^chg-removed-/, '')];
      if (eng && eng._renderRemoved) eng._renderRemoved();
    });
    /* v2.6.0: a windowed tree table draws its open rows (up to 2,000) for paper */
    dhTtPrintHooks.forEach(function (h) { h.before(); });

    /* 1. light theme, without recording it as the reader's choice */
    if (themeMode !== 'light') applyThemeMode('light');
    document.documentElement.classList.add('dh-printing');

    /* 2. page header/footer text: title + page numbers (CSS @page boxes) */
    var pageCss = document.createElement('style');
    pageCss.setAttribute('data-dh-print', '');
    pageCss.textContent = '@page { @top-left { content: ' + _cssString(PRINT_CONFIG.title || document.title) +
      '; font-size: 8pt; color: #666; } @bottom-right { content: "Page " counter(page) " of " counter(pages); font-size: 8pt; color: #666; } }';
    document.head.appendChild(pageCss);
    st.added.push(pageCss);

    /* 3. every nav view, in menu order, each under its path */
    var main = document.querySelector('main.report-body');
    var tree = (typeof buildNavTree === 'function') ? buildNavTree() : null;
    if (main && tree) {
      var rank = _navOrderIndex(tree);
      var secs = Array.prototype.slice.call(main.querySelectorAll(':scope > [data-navpath]'));
      var withPath = secs.map(function (s, i) {
        var p = navPathOf(s);
        var scope = (s.dataset.navscope || 'exact').toLowerCase();
        return { el: s, path: p, global: scope === 'global' || !p.length, r: rank[JSON.stringify(p)], seq: parseInt(s.dataset.navseq || i, 10), i: i };
      }).filter(function (x) { return !x.global; });
      withPath.sort(function (a, b) {
        var ra = (a.r === undefined ? 1e9 : a.r), rb = (b.r === undefined ? 1e9 : b.r);
        return (ra - rb) || (a.seq - b.seq) || (a.i - b.i);
      });
      var lastKey = null;
      withPath.forEach(function (x) {
        st.moved.push({ el: x.el, parent: x.el.parentNode, next: x.el.nextSibling });
        var key = JSON.stringify(x.path);
        if (key !== lastKey) {
          var h = document.createElement('h2');
          h.className = 'dh-print-path';
          h.textContent = _navLabelPath(tree, x.path).join(' \u203A ');
          main.appendChild(h);
          st.added.push(h);
          lastKey = key;
        }
        main.appendChild(x.el);                       /* move, in menu order */
      });
    }

    /* 4. tables: all filtered rows up to maxRows */
    var maxRows = PRINT_CONFIG.maxRows || 200;
    Object.keys(engines).forEach(function (id) {
      var eng = engines[id];
      var total = eng._getFiltered().length;
      st.engines[id] = true;
      eng._printRows = Math.max(1, maxRows);
      eng.render();
      if (total > maxRows) {
        var sec = document.getElementById('section-' + id);
        var wrap = sec && sec.querySelector('.table-wrapper');
        if (wrap) {
          var note = document.createElement('p');
          note.className = 'dh-print-note';
          note.textContent = 'Showing ' + maxRows + ' of ' + total + ' rows. Full data in the interactive report.';
          wrap.parentNode.insertBefore(note, wrap.nextSibling);
          st.added.push(note);
        }
      }
    });

    /* 5. cover page */
    if (PRINT_CONFIG.cover) {
      var cover = document.createElement('section');
      cover.className = 'dh-print-cover';
      var hdr = document.querySelector('.report-header');
      if (hdr) {
        var logo = hdr.querySelector('.report-logo');
        if (logo) cover.appendChild(logo.cloneNode(true));
        var t = hdr.querySelector('.report-title');
        if (t) { var h1 = document.createElement('h1'); h1.textContent = t.textContent; cover.appendChild(h1); }
        var sub = hdr.querySelector('.report-subtitle');
        if (sub) cover.appendChild(sub.cloneNode(true));
        var info = hdr.querySelector('.info-fields-grid');
        if (info) cover.appendChild(info.cloneNode(true));
        var gen = hdr.querySelector('.header-meta');
        if (gen) cover.appendChild(gen.cloneNode(true));
      }
      /* the overall assessment (verdict) and, from 2.3.0, the score ring */
      ['.tile-verdict', '.tile-score'].forEach(function (sel) {
        var tileEl = document.querySelector(sel);
        if (tileEl) {
          var vwrap = document.createElement('div');
          vwrap.className = 'dh-print-cover-verdict';

  }

  function dhAfterPrint() {
    var st = _printState;
    if (!st) return;
    _printState = null;
    /* put sections back exactly where they were, last-moved first */
    for (var i = st.moved.length - 1; i >= 0; i--) {

  function initPrint() {
    window.addEventListener('beforeprint', dhBeforePrint);
    window.addEventListener('afterprint', dhAfterPrint);

    if (btn) btn.addEventListener('click', function () { window.print(); });
  }
  window._dhBeforePrint = dhBeforePrint;   /* for pipelines that print without events */
  window._dhAfterPrint  = dhAfterPrint;

  /* =========================================================================
     BOOT
     ========================================================================= */

  /* v2.1.4 — restore a saved theme NOW, while the script is parsed, so the
     page does not paint in the default theme first and then flash. The two
     theme <style> tags are already in <head>. */
  (function () {
    var m = savedThemeMode();
    if (m) { themeChosen = true; applyThemeMode(m); return; }
    /* v2.2.0 — no saved choice: New-DhDashboard -ThemeMode decides. 'auto'
       follows the system setting, live, until the reader toggles. */

    if (def === 'auto' && window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      applyThemeMode(mq.matches ? 'dark' : 'light');
      var follow = function (e) { if (!themeChosen) applyThemeMode(e.matches ? 'dark' : 'light'); };
      if (mq.addEventListener) mq.addEventListener('change', follow);
      else if (mq.addListener) mq.addListener(follow);
    } else if (def === 'dark') {
      applyThemeMode('dark');
    }
  })();

  /* v2.6.0 - Export-DhDashboard -CompressData: the table and block JSON is gzip + base64 in DH_ZDATA and
     is unpacked (DecompressionStream, async) before anything reads it. Without compression the boot runs
     synchronously, exactly as before. A browser without DecompressionStream gets a message and an empty
     report rather than a broken one. */

  }

    function fail() {

      var msg = document.createElement('div');
      msg.className = 'dh-unzip-fail'; msg.setAttribute('role', 'alert');
      msg.textContent = 'This report stores its data compressed, and this browser cannot unpack it. Open it in a current Edge, Chrome, Firefox or Safari.';
      main.insertBefore(msg, main.firstChild);

    if (typeof DecompressionStream === 'undefined' || typeof Response === 'undefined' || typeof Blob === 'undefined' || !new Blob([]).stream) { fail(); return; }
    Promise.all([z.t ? dhUnzip(z.t) : null, z.b ? dhUnzip(z.b) : null]).then(function (r) {

      if (r[1] !== null) BLOCKS_CONFIG = JSON.parse(r[1]);

  }

  document.addEventListener('DOMContentLoaded', function () {
    if (DH_ZDATA) dhUnzipConfig(DH_ZDATA, dhBoot); else dhBoot();
  });

  function dhBoot() {
    renderSummary();
    renderBlocks();

    TABLES_CONFIG.forEach(function (cfg) {
      engines[cfg.id] = new TableEngine(cfg);
    });
    /* v2.4.0 - column widths are measured with the cell font; measure again once web fonts have loaded */
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(function () {
        Object.keys(engines).forEach(function (id) { engines[id]._refit(); });
      });
    }

    /* Bar charts, Mode-A pie charts and table-fed range bars need engines ready.
       v2.1.1 - all three go through blockRenderTarget so a collapsible block is
       re-rendered into its INNER container. Targeting 'block-<id>' directly (as
       barchart and piechart did before 2.1.1) overwrites the collapsible header
       renderBlocks() just built, which is why -Collapsible / -DefaultOpen had no
       visible effect on these block types. */
    BLOCKS_CONFIG.forEach(function (block) {
      if (block.blockType === 'barchart') {
        var bcT = blockRenderTarget(block);
        if (bcT.container) renderBarChart(bcT.container, bcT.block);
      } else if (block.blockType === 'piechart' && block.mode === 'fromtable') {
        var pcT = blockRenderTarget(block);
        if (pcT.container) renderPieChart(pcT.container, pcT.block);
      } else if (block.blockType === 'rangebar' && block.mode === 'fromtable') {
        var rbT = blockRenderTarget(block);
        if (rbT.container) renderRangeBar(rbT.container, rbT.block);
      } else if (block.blockType === 'treefilter') {
        /* v2.4.0 - needs the engine of the table it filters */

        if (tfT.container) renderTreeFilter(tfT.container, tfT.block);

    });

       and AFTER initNav() exposes window._showPanel. Moved below. */

    /* Global filter bar (v1.9.0) — restore any saved selection, render the
       controls, then subscribe every table (and its derived charts) so a
       change re-filters the whole page at once. */

    if (_gfSaved) {
      if (_gfSaved.facets) Object.keys(_gfSaved.facets).forEach(function (f) { GlobalFilter.facets[f] = _gfSaved.facets[f]; });
      if (_gfSaved.ranges) Object.keys(_gfSaved.ranges).forEach(function (f) { GlobalFilter.ranges[f] = _gfSaved.ranges[f]; });
    }
    renderGlobalFilters();
    GlobalFilter.subscribe(function () {
      Object.keys(engines).forEach(function (id) {
        var e = engines[id];
        e.currentPage = 1;
        e.render();
        e._refreshLinkedBarCharts();
        e._renderCharts();
      });
      updateNavBadges();
    });
    /* Tables already rendered above without the restored filter — apply it now. */
    if (GlobalFilter.active()) {
      Object.keys(engines).forEach(function (id) {
        var e = engines[id]; e.currentPage = 1; e.render(); e._refreshLinkedBarCharts(); e._renderCharts();
      });
    }

    initNav();
    initSearch();          /* v2.4.0 */
    syncNavTop();
    window.addEventListener('resize', syncNavTop);
    initThemeToggle();
    initDensityToggle();
    initPrint();           /* v2.2.0 */
    initTableCollapsibles();
    /* v2.5.3 - bound here: the runtime is one IIFE, so the page uses no inline on* handlers */
    var topBtn = document.getElementById('btn-nav-top');
    if (topBtn) topBtn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

       and engines[] exists, so action buttons can navigate + filter. */
    renderAlerts();

    /* ── Restore URL state: density + card filters ── */
    var _saved = URLState.load();
    if (_saved.density) {
      /* v2.1.4 — DENSITY.set moves the toggle's position too */
      DENSITY.set(_saved.density);
    } else {
      /* v2.7.0 — no reader choice in the URL: open at the density the report
         was authored with (New-DhDashboard -Density). 'normal' is the default
         and needs no class, so only a non-normal value is applied. */
      var _d = document.documentElement.getAttribute('data-density');
      if (_d && _d !== 'normal') DENSITY.set(_d);
    }
    if (_saved.cardFilters) {
      /* Re-apply saved card filters — mark active cards and update engines */
      Object.keys(_saved.cardFilters).forEach(function (filterId) {
        var cf = _saved.cardFilters[filterId];
        cardFilters[filterId] = cf;
        /* Mark active cards visually */
        var grid = document.getElementById('fcgrid-' + filterId);
        if (grid) {
          grid.querySelectorAll('.filter-card').forEach(function (card) {
            var cardVal = card.querySelector('.filter-card-name');
            if (cardVal && cf.values && cf.values.indexOf(cardVal.textContent) !== -1) {
              card.classList.add('active');
            }

        }
        /* Update engine */
        if (cf.tableId && engines[cf.tableId]) {
          engines[cf.tableId]._applyCardFilters();

    }

    updateNavBadges();
    /* v2.6.0 - -LinkState: the page number last, once every other restored filter is in place */
    dhTableStateFinish(engines);
  }

})();
